<text x="34.0" y="64.0" font-family="PC, 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif" font-weight="600" font-size="32" fill="#e8eef3" letter-spacing="-0.3">Snake RL</text>
<text x="35.0" y="92.0" font-family="PS, 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="500" font-size="16" fill="#7cc4e4">Deep reinforcement learning</text>
<text x="35.0" y="128.0" font-family="PS, 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" font-size="15" fill="#e8eef3" fill-opacity=".9">An agent that teaches itself Snake by trial and error: a Dueling</text>
