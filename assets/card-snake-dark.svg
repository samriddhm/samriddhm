<text x="35.0" y="174.0" font-family="PS, 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" font-size="15" fill="#e8eef3" fill-opacity=".9">and n-step returns, tested on board sizes it never trained on.</text>
